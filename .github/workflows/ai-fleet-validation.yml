name: Flota IA - auditoria paralela

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "js/**"
      - ".github/scripts/**"
      - ".github/workflows/ai-fleet-validation.yml"
      - ".github/AI_*.md"
  schedule:
    - cron: "47 5 * * 1-5"

permissions:
  contents: read

jobs:
  catalog-integrity:
    name: Integridad del catalogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar JSON
        run: node -e "for (const f of ['data/products.json','data/catalog-control.json','data/product-schema.json','data/catalog-sources.json','data/exa-discovery.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"

  duplicate-audit:
    name: Auditoria de duplicados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar auditoria
        run: node .github/scripts/catalog-audit.mjs

  reconciliation-audit:
    name: Reconciliacion segura
    runs-on: ubuntu-latest
    needs: catalog-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construir evidencia
        run: node .github/scripts/build-evidence-from-discovery.mjs
      - name: Matching seguro
        run: node js/semantic-reconciler.js
      - name: Validacion final
        run: node .github/scripts/market-validation.mjs

  report:
    name: Informe de flota
    runs-on: ubuntu-latest
    needs:
      - catalog-integrity
      - duplicate-audit
      - reconciliation-audit
    steps:
      - name: Confirmar auditoria
        run: echo "Flota IA ejecutada correctamente."
