name: IMPERIA 360 — Auditoría diaria de tendencias y márgenes

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditar feed y márgenes
        env:
          TZ: America/Bogota
        run: |
          python - <<'PY'
          import json, math, os
          from datetime import datetime, timezone

          feed_path = "data/temu-trends.json"
          rules_path = "data/temu-pricing-rules.json"
          report_path = "data/temu-daily-audit.json"

          with open(feed_path, encoding="utf-8") as f:
              feed = json.load(f)
          with open(rules_path, encoding="utf-8") as f:
              rules = json.load(f)

          now = datetime.now(timezone.utc)
          rows = []
          publishable = 0
          review = 0

          def round100(x):
              return int(math.floor(x / 100.0 + 0.5) * 100)

          for p in feed.get("products", []):
              status = p.get("status", "review")
              landed = p.get("landedCostCOP")
              current_price = p.get("publicPriceCOP")
              margin = None
              calculated = None

              if isinstance(landed, (int, float)) and landed > 0:
                  target = rules["rules"]["retail"]["targetMargin"]
                  minimum = rules["rules"]["retail"]["minimumMargin"]
                  calculated = round100(landed / (1 - target))
                  if isinstance(current_price, (int, float)) and current_price > 0:
                      margin = round((current_price - landed) / current_price, 4)
                  if status == "verified" and (margin is None or margin < minimum):
                      status = "review"
                      p["status"] = "review"
                      p["reviewReason"] = "Margen inferior al mínimo configurado"
                  elif status == "verified":
                      publishable += 1
              else:
                  status = "review"
                  review += 1

              rows.append({
                  "name": p.get("name"),
                  "status": status,
                  "landedCostCOP": landed,
                  "calculatedRetailPriceCOP": calculated,
                  "publicPriceCOP": current_price,
                  "grossMargin": margin
              })

          with open(feed_path, "w", encoding="utf-8") as f:
              json.dump(feed, f, ensure_ascii=False, indent=2)
              f.write("\n")

          report = {
              "generatedAtUTC": now.isoformat(),
              "source": feed.get("source"),
              "productsReviewed": len(rows),
              "publishableVerifiedProducts": publishable,
              "productsInReview": len(rows) - publishable,
              "marginRule": rules["rules"],
              "rows": rows,
              "important": "Este workflow audita y calcula márgenes con datos ya verificados. No realiza scraping/crawling ni compras automáticas en Temu."
          }
          with open(report_path, "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Guardar auditoría diaria
        run: |
          git config user.name "IMPERIA 360 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temu-daily-audit.json data/temu-trends.json
          git diff --cached --quiet || git commit -m "chore: auditoría diaria de tendencias y márgenes"
          git push
