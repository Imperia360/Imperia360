name: IMPERIA 360 — Enriquecimiento de imágenes

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/scripts/enrich-product-images.mjs'
      - '.github/workflows/imperia-image-enrichment.yml'
      - '.github/AI_FLEET_TASKS.md'
      - 'assets/images/products/README.md'
      - 'js/catalog-loader.js'
      - 'data/fastener-family-images.json'
      - 'data/products.json'
      - 'data/imperia-reference-pricing.json'
      - 'data/gemini-google-discovery.json'
      - '.github/scripts/prepare-image-google-queue.mjs'
      - '.github/scripts/run-gemini-google-discovery.mjs'
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: imperia-image-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    name: Lote automático de imágenes verificadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validación previa de sintaxis y datos
        run: |
          set -euo pipefail
          node --check .github/scripts/enrich-product-images.mjs
          node --check .github/scripts/prepare-image-google-queue.mjs
          node --check .github/scripts/run-gemini-google-discovery.mjs
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['data/products.json', 'data/product-images.json', 'data/fastener-family-images.json']) {
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (file === 'data/products.json' && !Array.isArray(parsed)) throw new Error('products.json debe ser un arreglo');
            if (file === 'data/product-images.json' && !Array.isArray(parsed.records)) throw new Error('product-images.json debe contener records[]');
            console.log('JSON OK:', file);
          }
          NODE
      - name: Preparar cola de imágenes con Google
        run: node .github/scripts/prepare-image-google-queue.mjs
      - name: Buscar páginas de producto con Gemini + Google Search
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_DISCOVERY_BATCH: "5"
        run: node .github/scripts/run-gemini-google-discovery.mjs
      - name: Procesar siguiente lote de productos sin imagen
        run: node .github/scripts/enrich-product-images.mjs
      - name: Auditar resultados antes de publicar
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/product-images.json', 'utf8'));
          const records = data.records || [];
          const seen = new Set();
          const errors = [];
          for (const r of records) {
            const id = String(r.productId || '').trim();
            if (!id) errors.push('registro sin productId');
            if (seen.has(id)) errors.push('productId duplicado: ' + id);
            seen.add(id);
            const blocked = /sofalca\\.com/i.test(String(r.imageUrl || '') + ' ' + String(r.sourcePage || '')) ||
              /^sofalca$/i.test(String(r.source || ''));
            if (blocked && r.publishable === true) errors.push('fuente bloqueada marcada publicable: ' + id);
            if (r.publishable === true && (!r.imageUrl || !/^https?:\\/\\//i.test(r.imageUrl))) errors.push('imagen publicable sin URL válida: ' + id);
          }
          const verified = records.filter(r => r.publishable === true && r.verificationStatus === 'verified_source_image').length;
          console.log(JSON.stringify({records: records.length, verifiedPublishable: verified, uniqueProductIds: seen.size, errors: errors.length}, null, 2));
          if (errors.length) {
            console.error(errors.slice(0, 50).join('\\n'));
            process.exit(1);
          }
          NODE
      - name: Guardar coincidencias verificadas
        run: |
          if git diff --quiet -- data/product-images.json; then
            echo "Sin nuevas imágenes verificadas en este lote."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/product-images.json /tmp/product-images-generated.json
          git fetch origin main
          git checkout origin/main -- data/product-images.json
          node <<'NODE'
          const fs = require("fs");
          const remote = JSON.parse(fs.readFileSync("data/product-images.json", "utf8"));
          const generated = JSON.parse(fs.readFileSync("/tmp/product-images-generated.json", "utf8"));
          const byId = new Map((remote.records || []).map(r => [r.productId, r]));
          for (const record of generated.records || []) {
            if (!byId.has(record.productId)) byId.set(record.productId, record);
          }
          const merged = {
            ...remote,
            generatedAt: generated.generatedAt || remote.generatedAt,
            records: [...byId.values()]
          };
          fs.writeFileSync("data/product-images.json", JSON.stringify(merged, null, 2) + "\n");
          NODE
          if git diff --quiet -- data/product-images.json; then
            echo "Sin nuevas imágenes después de sincronizar con main."
            exit 0
          fi
          git add data/product-images.json
          git commit -m "chore: add verified product images batch"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Lote de imágenes publicado correctamente en main."
              exit 0
            fi
            echo "Push concurrente; sincronizando main (intento $attempt/5)..."
            git fetch origin main
            git rebase origin/main
          done
          echo "No fue posible publicar el lote después de 5 intentos."
          exit 1

# Continuous completion trigger verified 2026-09-29.
