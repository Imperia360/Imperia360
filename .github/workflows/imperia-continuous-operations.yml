name: IMPERIA 360 — Operación continua
# Operational cycle trigger: keep discovery, audit, evidence and site gates running.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: imperia-continuous-operations
  cancel-in-progress: false

jobs:
  discovery-queue:
    name: 0. Cola de descubrimiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construir cola de fuentes
        run: node .github/scripts/build-discovery-queue.mjs
      - name: Descubrimiento web Exa
        continue-on-error: true
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: node .github/scripts/run-exa-discovery.mjs
      - name: Descubrimiento Google Search con Gemini 3.8 Flash
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/run-gemini-google-discovery.mjs
      - name: Publicar resultados de descubrimiento
        uses: actions/upload-artifact@v4
        with:
          name: imperia-discovery
          path: |
            data/discovery-queue.json
            data/exa-discovery.json
            data/gemini-google-discovery.json
          retention-days: 14

  image-enrichment:
    name: 1B. Imágenes verificadas por lote
    needs: product-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxis del enriquecedor
        run: node --check .github/scripts/enrich-product-images.mjs
      - name: Ejecutar enriquecimiento real de imágenes
        run: node .github/scripts/enrich-product-images.mjs
      - name: Publicar mapa de imágenes
        run: |
          git config user.name "IMPERIA 360 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/product-images.json
          if git diff --cached --quiet; then
            echo "Sin nuevas imágenes verificadas en este lote."
            exit 0
          fi
          git commit -m "chore: publish verified product images"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

  product-verification:
    name: 1A. Verificación automática de precios
    needs: discovery-queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar precios con Gemini 3.8 + Google Search
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/verify-product-prices-gemini.mjs
      - name: Publicar precios verificados
        run: |
          git config user.name "IMPERIA 360 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json
          if git diff --cached --quiet; then
            echo "Sin nuevos precios verificables en este lote."
            exit 0
          fi
          git commit -m "chore: publish Gemini-verified catalog prices"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

  integrity:
    name: 1. Integridad y JSON
    # Se ejecuta en paralelo con el enriquecimiento de imágenes para reducir la espera.
    needs: product-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxis de scripts críticos
        run: |
          node --check .github/scripts/enrich-product-images.mjs
          node --check .github/scripts/reconcile-catalog-control.mjs
      - name: Validar archivos críticos
        run: |
          node -e "const fs=require('fs'); const files=['data/products.json','data/catalog-control.json','data/catalog-audit.json','data/inventory-base.json','data/reconciliation-review.json','data/catalog-sources.json']; for(const f of files){JSON.parse(fs.readFileSync(f,'utf8')); console.log('OK',f)}"

  catalog-gate:
    name: 2. Compuerta de catálogo
    needs: [integrity, image-enrichment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconciliar control maestro contra archivos reales
        run: node .github/scripts/reconcile-catalog-control.mjs
      - name: Publicar control maestro reconciliado
        run: |
          git config user.name "IMPERIA 360 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog-control.json
          if git diff --cached --quiet; then
            echo "Control maestro ya estaba reconciliado."
          else
            git commit -m "chore: reconcile master catalog control"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
      - name: Auditoría de duplicados
        run: node .github/scripts/catalog-audit.mjs
      - name: Validación de mercado
        run: node .github/scripts/market-validation.mjs
      - name: Comprobar reconciliación
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const audit=JSON.parse(fs.readFileSync('data/catalog-audit.json','utf8'));
          const control=JSON.parse(fs.readFileSync('data/catalog-control.json','utf8'));
          if ((audit.issuesCount||0) > 0) console.log('NOTICE: catalog issues remain; publication stays gated.');
          if (control.currentLoadedStatus !== 'active') console.log('NOTICE: master catalog is not active; no automatic activation permitted.');
          console.log(JSON.stringify({masterProducts:audit.masterProducts,issuesCount:audit.issuesCount,currentLoadedProducts:control.currentLoadedProducts,currentLoadedStatus:control.currentLoadedStatus},null,2));
          NODE

  evidence-gate:
    name: 3. Evidencia y publicación segura
    needs: catalog-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no-invention policy
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const inv=JSON.parse(fs.readFileSync('data/inventory-base.json','utf8'));
          const control=JSON.parse(fs.readFileSync('data/catalog-control.json','utf8'));
          if (!inv.priceRules || !inv.publicationGate || !inv.duplicateRules) process.exit(1);
          if (inv.priceRules.neverInvent !== true || inv.priceRules.sourcePriceOnly !== true) process.exit(1);
          if (control.imagePolicy && control.imagePolicy.noInventedImages !== true) process.exit(1);
          console.log('Publication safety rules present.');
          NODE
      - name: Summary
        run: |
          echo "Discovery is separated from verification."
          echo "Historical candidates are not activated automatically."
          echo "No invented price, stock, reference or image is permitted."

  site-build-gate:
    name: 4. Sitio y despliegue
    needs: evidence-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site entry points
        run: |
          test -f index.html
          test -f js/catalog-loader.js
          test -f js/search-engine.js
          echo "Site entry points OK."

  operations-status:
    name: 5. Estado operativo
    needs: [discovery-queue, integrity, catalog-gate, evidence-gate, site-build-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Emitir estado
        run: |
          echo "IMPERIA 360 continuous operations cycle completed."
          echo "Discovery queue -> Exa discovery -> Gemini Google Search -> evidence -> reconciliation -> quality gate -> site validation."
          echo "Automatic publication remains evidence-gated."
