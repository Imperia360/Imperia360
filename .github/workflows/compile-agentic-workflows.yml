name: Compile Agentic Workflows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-agentic-workflows.yml"

permissions:
  contents: write

concurrency:
  group: compile-agentic-workflows
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GitHub Agentic Workflows extension
        run: gh extension install github/gh-aw

      - name: Compile and validate agentic workflows
        run: gh aw compile --strict

      - name: Commit generated lock files
        run: |
          if git diff --quiet -- .github/workflows/*.lock.yml; then
            echo "No lock-file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml
          git commit -m "chore: compile GitHub agentic workflows"
          git push
