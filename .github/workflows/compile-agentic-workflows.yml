name: Compile Agentic Workflows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-agentic-workflows.yml"

permissions:
  contents: write

concurrency:
  group: compile-agentic-workflows
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GitHub Agentic Workflows extension
        run: gh extension install github/gh-aw

      - name: Compile and validate agentic workflows
        run: gh aw compile --strict --approve

      - name: Upload compiled lock files
        uses: actions/upload-artifact@v4
        with:
          name: imperia-agentic-lock-files
          path: .github/workflows/*.lock.yml
          if-no-files-found: error

      - name: Commit generated lock files
        run: |
          set -euo pipefail
          shopt -s nullglob
          locks=(.github/workflows/*.lock.yml)
          if [ ${#locks[@]} -eq 0 ]; then
            echo "No lock files generated."
            exit 1
          fi

          git add -- ${locks[@]}
          if git diff --cached --quiet; then
            echo "No lock-file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: compile GitHub agentic workflows"

          # Rebase only if main advanced while this run was compiling.
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            git rebase origin/main
          fi
          git push origin HEAD:main
