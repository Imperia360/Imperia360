name: Compile Agentic Workflows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-agentic-workflows.yml"

permissions:
  contents: write

concurrency:
  group: compile-agentic-workflows
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GitHub Agentic Workflows extension
        run: gh extension install github/gh-aw

      - name: Compile and validate agentic workflows
        run: gh aw compile --strict --approve

      - name: Upload compiled lock files
        uses: actions/upload-artifact@v4
        with:
          name: imperia-agentic-lock-files
          path: .github/workflows/*.lock.yml
          if-no-files-found: error

      - name: Commit generated lock files
        run: |
          if ! find .github/workflows -maxdepth 1 -name "*.lock.yml" -print -quit | grep -q .; then
            echo "No lock files generated."
            exit 1
          fi
          if git diff --quiet -- .github/workflows/*.lock.yml && git status --porcelain -- .github/workflows/*.lock.yml | grep -q "^$"; then
            echo "No lock-file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml
          git commit -m "chore: compile GitHub agentic workflows"
          git pull --rebase origin main
          git push
