name: Validacion masiva de mercado con IA

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1-5'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descubrimiento de fuentes con Exa
        if: ${{ secrets.EXA_API_KEY != '' }}
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: node .github/scripts/exa-discovery.mjs

      - name: Registrar ausencia de Exa
        if: ${{ secrets.EXA_API_KEY == '' }}
        run: node .github/scripts/exa-discovery.mjs

      - name: Validar catalogo y ofertas
        run: node .github/scripts/market-validation.mjs

      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exa-discovery.json data/validation-results.json
          git diff --cached --quiet || git commit -m "chore: actualizar descubrimiento y validacion de mercado"
          git push
