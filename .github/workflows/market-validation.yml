name: Validacion masiva de mercado

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1-5'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar catalogo y ofertas
        run: node .github/scripts/market-validation.mjs

      - name: Publicar resultados de validacion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation-results.json
          git diff --cached --quiet || git commit -m "chore: actualizar validacion de mercado"
          git push
