name: Auto launch pricing

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate provisional prices
        run: node .github/scripts/auto-launch-pricing.mjs
      - name: Publish pricing data
        run: |
          git config user.name "IMPERIA 360 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/auto-pricing.json
          if git diff --cached --quiet; then
            echo "No pricing changes"
          else
            git commit -m "chore: publish provisional catalog pricing"
            git push
          fi
